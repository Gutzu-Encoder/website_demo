<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quick Quiz</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">

    <!-- WELCOME SCREEN -->
    <section id="welcome-screen" class="screen">
      <h1>Quick Quiz</h1>
      <p class="subtitle">Answer 8 questions and see how you do. Enter your name to get started.</p>
      <form id="welcome-form">
        <label for="player-name">Your name</label>
        <input type="text" id="player-name" placeholder="e.g. Alex" autocomplete="off" />
        <p id="name-error" class="error hidden">Please enter your name.</p>
        <button type="submit" class="btn-primary">Start Quiz</button>
      </form>
    </section>

    <!-- QUIZ SCREEN -->
    <section id="quiz-screen" class="screen hidden">
      <p id="progress" class="progress">Question 1 of 8</p>
      <h2 id="question-text"></h2>
      <div id="choices" class="choices"></div>
    </section>

    <!-- FINISH SCREEN -->
    <section id="finish-screen" class="screen hidden">
      <h1 id="finish-heading"></h1>
      <p id="finish-score" class="score"></p>
      <h3>Your answers</h3>
      <ol id="summary-list" class="summary-list"></ol>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
